<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chessy's Adventure</title><style>:root{--i:#17364c;--c:#fff8e7;--b:#177f9b;--l:#ffe99a;--m:#d5f1df;--g:#ffd354}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:18px system-ui}header{padding:.7rem max(1rem,calc((100% - 1000px)/2));display:flex;justify-content:space-between;background:#fff;border-bottom:3px solid var(--i)}main{max-width:1000px;margin:auto;padding:1.5rem 1rem 6rem}.p,.card{background:#fff;border:3px solid var(--i);border-radius:22px;padding:1.3rem;box-shadow:0 6px #17364c22}.hero{text-align:center}.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:1rem}button{font:inherit;font-weight:750;color:var(--i);background:#fff;border:3px solid var(--i);border-radius:14px;padding:.6rem .9rem;cursor:pointer;box-shadow:0 3px #17364c22}.primary{background:var(--g)}.tag,#stars{background:var(--m);border-radius:999px;padding:.25rem .65rem;font-weight:800}.actions,.toolbar{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}.coach{background:#e5f5ff;border:2px solid var(--i);border-radius:16px;padding:.7rem;max-width:650px;margin:1rem auto}.board{touch-action:none;display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,600px);aspect-ratio:1;border:5px solid var(--i);margin:1rem auto;border-radius:12px;overflow:hidden}.sq{position:relative;border:0;border-radius:0;box-shadow:none;padding:0;font-size:clamp(1.2rem,5vw,2.5rem)}.coord{position:absolute;bottom:2px;right:3px;font-size:clamp(.55rem,1.3vw,.8rem);font-weight:800;pointer-events:none;opacity:.75}.d .coord{color:white}.l{background:var(--l)}.d{background:var(--b)}.bad{animation:x .2s 2}@keyframes x{50%{transform:translateX(5px)}}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--i);padding:.5rem;display:flex;justify-content:center;gap:.5rem}.big{font-size:4rem}.center{text-al <style>
/* Let the lesson, board and navigation use the page naturally. */
header{position:static;padding:.35rem max(.6rem,calc((100% - 1000px)/2));box-shadow:none;align-items:center}

.p:has(.board){padding:.8rem}

<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script><script>
const K='shrithaChessV2',F='abcdefgh';let S=JSON.parse(localStorage.getItem(K)||'{}');S={stars:0,world:0,rookDone:false,knightDone:false,...S};let L=S.lessons||{rook:{p:'b2',z:['b6','f2','f6'],h:[]},knight:{p:'b1',z:['c3','d2','a3'],h:[]}};let screen='welcome';const A=document.querySelector('#app'),save=()=>{S.lessons=L;localStorage.setItem(K,JSON.stringify(S));document.querySelector('#stars').textContent='★ '+S.stars},set=h=>{A.innerHTML=h;save();scrollTo(0,0)},bd=(id,draw)=>{let h='<div id="'+id+'" class="board" role="group" aria-label="Chess board">';for(let r=8;r;r--)for(let f=0;f<8;f++){let q=F[f]+r;h+='<button aria-label="'+q+'" class="sq '+((f+r)%2?'d':'l')+'" data-q="'+q+'">'+draw(q)+(r===1?'<span class="coord">'+F[f]+'</span>':'')+(f===0?'<span class="coord" style="left:3px;right:auto;top:2px;bottom:auto">'+r+'</span>':'')+'</button>'}return h+'</div>'},hook=(id,fn)=>{let root=document.querySelector('#'+id),start=null,suppress=false;root.onpointerdown=e=>{start=e.target.closest('[data-q]')?.dataset.q};root.onpointerup=e=>{let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-q]'),q=target?.dataset.q,allowed=screen==='rook'?start===L.rook.p:screen==='knight'?start===L.knight.p:false;if(allowed&&q&&q!==start){suppress=true;fn(q,target);setTimeout(()=>suppress=false,0)}start=null};root.onclick=e=>{if(suppress)return;let q=e.target.closest('[data-q]')?.dataset.q;if(q)fn(q,e.target.closest('button'))}};

function chessyArt(){return `<svg class="mascot" viewBox="0 0 160 160" role="img" aria-label="Coach Chessy the owl waving hello"><path d="M31 74 Q18 46 28 19 L55 39 Q80 26 105 39 L132 19 Q142 46 129 74 Q143 107 120 130 Q80 151 40 130 Q17 107 31 74Z" fill="#b87843" stroke="#17364c" stroke-width="4"/><path d="M39 87 Q79 65 121 87 Q128 117 112 131 Q80 146 48 131 Q32 116 39 87Z" fill="#f4d6a3"/><ellipse class="wing" cx="30" cy="96" rx="16" ry="29" fill="#a6643a" stroke="#17364c" stroke-width="3"/><circle cx="61" cy="72" r="21" fill="#fffdf3"/><circle cx="99" cy="72" r="21" fill="#fffdf3"/><ellipse class="eye" cx="66" cy="72" rx="6" ry="9" fill="#17364c"/><ellipse class="eye" cx="94" cy="72" rx="6" ry="9" fill="#17364c"/><path d="M73 91 L80 103 L87 91Z" fill="#f3ad55" stroke="#17364c" stroke-width="2"/><path d="M69 112 Q80 123 91 112" fill="none" stroke="#17364c" stroke-width="3" stroke-linecap="round"/><path d="M62 137 L58 148 M98 137 L102 148" stroke="#efad5e" stroke-width="4" stroke-linecap="round"/></svg>`}

function home(){screen='home';if(!S.started)return welcome();let n=S.world===0?'Board Explorer':!S.rookDone?'Rocky the Rook':!S.checks?.rook?'Rocky’s quiet check':!S.knightDone?'Klip-Klop the Knight':!S.checks?.knight?'Klip-Klop’s quiet check':!S.pieceDone?.bishop?'Bea the Bishop':!S.pieceDone?.queen?'Queen’s roads':!S.pieceDone?.king?'King’s careful steps':!S.pieceDone?.pawn?'Pawn march':!S.combatDone?.capture?'Capture a pawn':!S.combatDone?.escape?'Escape check':!S.combatDone?.promotion?'Promote a pawn':!S.pennyDone?'Penny Panda':!S.stalemateDone?'Stalemate or checkmate?':!S.foxyDone?'Foxy’s challenge':!S.mateDone?'Finish Together':S.review?.length&&!S.reviewDone?'Coach Review':'Timmy Turtle';if(['rook','knight'].some(k=>S.reviewDue?.[k]&&Date.now()>=S.reviewDue[k]))n='A little memory adventure';set('<section class="p hero"><span class="tag">Your next helpful step</span><h1>'+n+' is ready!</h1><p>One small adventure at a time. Your stars stay forever.</p><button class="primary" onclick="next()">Continue Adventure</button></section><section class="grid"><article class="card"><h2>🎮 Play</h2><p>Real legal chess moves with Timmy.</p><button onclick="play()">Play</button></article><article class="card"><h2>🗺️ Explore</h2><p>Maps, puzzles, and playgrounds.</p><button onclick="explore()">Explore</button></article><article class="card"><h2>🏰 My Kingdom</h2><p>See your cumulative unlocks.</p><button onclick="kingdom()">Visit</button></article></section>')}

function welcome(){screen='welcome';set('<section class="p hero">'+chessyArt()+'<span class="tag">A calm chess adventure</span><h1>Hi! I’m Coach Chessy.</h1><p>Are you new to chess? Let’s play right away.</p><div class="actions"><button class="primary" onclick="S.started=true;S.world=0;save();world0()">I’m brand new</button><button onclick="S.started=true;S.world=1;save();rook()">I know a little</button><button onclick="S.started=true;S.world=2;save();knight()">I already play</button></div></section>')}

function next(){if(S.world===0)return world0();for(let k of ['rook','knight'])if(S.reviewDue?.[k]&&Date.now()>=S.reviewDue[k])return retention(k);if(!S.rookDone)return rook();if(!S.checks?.rook)return quietCheck('rook');if(!S.knightDone)return knight();if(!S.checks?.knight)return quietCheck('knight');for(let k of ['bishop','queen','king','pawn'])if(!S.pieceDone?.[k])return pieceAdventure(k);for(let k of ['capture','escape','promotion'])if(!S.combatDone?.[k])return combatLesson(k);if(!S.pennyDone)return penny();if(!S.stalemateDone)return stalemateLesson();if(!S.foxyDone)return foxy();if(!S.mateDone)return finishing();if(S.review?.length&&!S.reviewDone)return coachReview();play()}

function world0(){screen='world0';let stage=S.boardStage??(S.world>0?2:0);S.boardStage=stage;S.boardPops=S.boardPops||[];if(stage<2){let light=stage===0,n=3-S.boardPops.length;set('<section class="p center"><span class="tag">World 0 · Board comfort</span><h1>Find '+(light?'light':'dark')+' squares</h1><p>The board has two colors. Tap '+n+' different '+(light?'light':'dark')+' square'+(n===1?'':'s')+'.</p>'+bd('b',q=>S.boardPops.includes(q)?'✨':'')+'<p id="c" class="coach" aria-live="polite">Choose a '+(light?'sunny light':'cool dark')+' square. There is no rush.</p><div class="toolbar"><button onclick="boardHelp()">Help</button><button onclick="S.boardPops=[];world0()">Again</button><button onclick="boardRewind()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{let f=F.indexOf(q[0]),r=+q[1],isLight=(f+r)%2===0;if(isLight===light&&!S.boardPops.includes(q)){S.boardPops.push(q);recordLearning('world0','success');if(S.boardPops.length===3){S.boardStage++;S.boardPops=[]}world0()}else{document.querySelector('#c').textContent=S.boardPops.includes(q)?'You found that one already. Try another square.':'That is a '+(isLight?'light':'dark')+' square. Find a '+(light?'light':'dark')+' one.';e.classList.add('bad');recordLearning('world0','mistakes')}});return}let t='e4';set('<section class="p center"><span class="tag">World 0 · Secret square names</span><h1>Find '+t+'</h1><p>Letters go across. Numbers go up.</p>'+bd('b',q=>'')+'<p id="c" class="coach" aria-live="polite">Tap the square Chessy named. Take your time.</p><div class="toolbar"><button onclick="boardHelp()">Help</button><button onclick="world0()">Again</button><button onclick="world0()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(q===t){S.world=Math.max(S.world,1);recordLearning('world0','success');save();celebrate('Board explorer!','You found e4. Letters go across; numbers go up.')}else{document.querySelector('#c').textContent='That is '+q+'. Look for the letter, then the number.';e.classList.add('bad');recordLearning('world0','mistakes')}})}
function boardHelp(){let stage=S.boardStage;recordLearning('world0','help');let q=stage===0?'a8':stage===1?'a1':'e4';document.querySelector('#b [data-q="'+q+'"]')?.classList.add('hint-square');document.querySelector('#c').textContent=stage===0?'The glowing pale gold square is light. Try a8.':stage===1?'The glowing blue square is dark. Try a1.':'Follow e along the bottom, then go up to the glowing square on row 4.'}
function boardRewind(){if(S.boardPops?.length)S.boardPops.pop();world0()}

function newTrack(k){S.trackRound=S.trackRound||{};let n=S.trackRound[k]||0;S.trackRound[k]=n+1;let options=k==='rook'?[{start:'c3',targets:['h3','h6','c6']},{start:'d2',targets:['h2','h5','d5']}]:[{start:'d4',targets:['f5','h6','g4']},{start:'e3',targets:['f5','h4','f3']}],v=options[n%options.length];L[k]={p:v.start,z:[...v.targets],h:[],start:v.start,targets:[...v.targets]};save()}
function resetTrack(k){let x=L[k],start=x.start||(k==='rook'?'b2':'b1'),targets=x.targets||(k==='rook'?['b6','f2','f6']:['c3','d2','a3']);L[k]={p:start,z:[...targets],h:[],start,targets:[...targets]};(k==='rook'?rook:knight)()}
function rewindTrack(k){let x=L[k],old=x.h.pop();if(old){x.p=old.p;x.z=old.z}(k==='rook'?rook:knight)()}

function line(a,b){let x=F.indexOf(a[0]),y=+a[1],X=F.indexOf(b[0]),Y=+b[1];if(a===b||b==='b4'||x!==X&&y!==Y)return false;let dx=Math.sign(X-x),dy=Math.sign(Y-y);for(x+=dx,y+=dy;x!==X||y!==Y;x+=dx,y+=dy)if(F[x]+y==='b4')return false;return true}

function rook(){screen='rook';let x=L.rook;set('<section class="p center"><span class="tag">World 1 · Rocky the Rook</span><h1>Collect Rocky’s track stars</h1><p>Rocky rolls straight, never through a rock.</p>'+bd('b',q=>q===x.p?'♜':q==='b4'?'🪨':x.z.includes(q)?'★':'')+'<p id="c" class="coach">Tap a star on Rocky’s straight track.</p><div class="toolbar"><button onclick="rookHelp()">Help</button><button onclick="resetTrack(\'rook\')">Again</button><button onclick="rewindTrack(\'rook\')">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!line(x.p,q)){document.querySelector('#c').textContent='Rocky needs one straight track and cannot roll through the rock.';e.classList.add('bad');recordLearning('rook','mistakes');return}x.h.push({p:x.p,z:[...x.z]});x.p=q;if(x.z.includes(q)){x.z=x.z.filter(z=>z!==q);recordLearning('rook','success');if(!S.rookDone)S.stars++;if(!x.z.length){S.rookDone=true;S.world=Math.max(2,S.world);save();return quietCheck('rook')}}rook()})}

let introToken=0;
function rockyIntro(){let token=++introToken;function scene(i){if(token!==introToken)return;screen='rookIntro';let messages=["Hi! I’m Rocky the Rook. I travel on straight tracks: across a row or up a column.","Watch me roll from b2 to f2. We stayed in the same row and reached the star!","But I cannot jump over the rock on b4 to reach b6. Now it’s your turn to try."];let board=bd('demoBoard',q=>q==='b4'?'🪨':q==='f2'?'★':'').replace('class="board"','class="board demo-board '+(i===1?'demo-slide':i===2?'demo-block':'')+'"').replace('</div>','<span class="demo-piece">♜</span></div>');set('<section class="p center"><span class="tag">Watch first · Rocky the Rook</span><h1>Meet Rocky!</h1><p>Watch his straight track, then try it yourself.</p>'+board+'<p id="c" class="coach" aria-live="polite">'+messages[i]+'</p><div class="toolbar"><button onclick="rockyIntro()">Show Again</button><button onclick="readCoach()">🔊 Hear this part</button>'+(i===2?'<button class="primary" onclick="rook()">Now you try</button>':'')+'<button onclick="home()">Pause / Save & finish</button></div></section>');speakWarm(messages[i]);if(i<2)setTimeout(()=>{if(token===introToken&&screen==='rookIntro')scene(i+1)},6000);else{S.intros=S.intros||{};S.intros.rook=true;save()}}scene(0)}
const originalRook=rook;
rook=function(){if(!S.intros?.rook)return rockyIntro();if(!L.rook.z.length)newTrack('rook');let result=originalRook();if(screen==='rook')document.querySelector('.toolbar')?.insertAdjacentHTML?.('afterbegin','<button onclick="rockyIntro()">Watch Rocky</button>');return result};

function knight(){screen='knight';let x=L.knight,ok=(a,b)=>Math.abs(F.indexOf(a[0])-F.indexOf(b[0]))*Math.abs(+a[1]-+b[1])===2;set('<section class="p center"><span class="tag">World 1 · Klip-Klop the Knight</span><h1>Jump in an L</h1><p>Two squares one way, one square sideways.</p>'+bd('b',q=>q===x.p?'♞':x.z.includes(q)?'★':'')+'<p id="c" class="coach">Tap an L-shaped landing star.</p><div class="toolbar"><button onclick="knightHelp()">Help</button><button onclick="resetTrack(\'knight\')">Again</button><button onclick="rewindTrack(\'knight\')">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!ok(x.p,q)){document.querySelector('#c').textContent='Not an L yet—two squares, then one sideways.';e.classList.add('bad');recordLearning('knight','mistakes');return}x.h.push({p:x.p,z:[...x.z]});x.p=q;if(x.z.includes(q)){x.z=x.z.filter(z=>z!==q);recordLearning('knight','success');if(!S.knightDone)S.stars++;if(!x.z.length){S.knightDone=true;S.world=Math.max(3,S.world);save();return quietCheck('knight')}}knight()})}

const originalKnight=knight;
knight=function(){if(!S.intros?.knight)return pieceIntro('knight');if(!L.knight.z.length)newTrack('knight');let result=originalKnight();if(screen==='knight')document.querySelector('.toolbar')?.insertAdjacentHTML?.('afterbegin','<button onclick="pieceIntro(\'knight\')">Watch Klip-Klop</button>');return result};
function drawGuide(boardId,from,to,knightShape=false){let board=document.querySelector('#'+boardId);if(!board||!from||!to)return;board.querySelector('.guide')?.remove();let point=q=>[F.indexOf(q[0])+.5,8-(+q[1])+.5],a=point(from),b=point(to),mid=knightShape?(Math.abs(b[0]-a[0])===2?[b[0],a[1]]:[a[0],b[1]]):null;let path='M '+a.join(' ')+' L '+(mid?mid.join(' ')+' L ':'')+b.join(' ');board.insertAdjacentHTML('beforeend','<svg class="guide" viewBox="0 0 8 8" aria-hidden="true"><path d="'+path+'"/><circle cx="'+b[0]+'" cy="'+b[1]+'" r=".27"/></svg>')}
function nextGuideStep(from,targets,isLegal){let seen=new Set([from]),queue=[[from,[]]];while(queue.length){let [at,path]=queue.shift();if(targets.includes(at)&&path.length)return path[0];for(let f of F)for(let r=1;r<=8;r++){let q=f+r;if(!seen.has(q)&&isLegal(at,q)){seen.add(q);queue.push([q,[...path,q]])}}}return null}
function rookHelp(){let x=L.rook,n=S.learning?.rook?.help||0,target=nextGuideStep(x.p,x.z,line);if(target)drawGuide('b',x.p,target);document.querySelector('#c').textContent=target?(x.z.includes(target)?'Follow the orange straight track to the star on '+target+'.':'Follow the orange track to '+target+' first. Then Rocky can turn toward a star.'): 'Rocky needs a clear straight track. Try Again to see the starting path.'}

function combatIntro(k){let token=++introToken,v=COMBAT[k],[from,to]=v.goal.split('-'),piece=k==='escape'?'♔':'♙';function scene(i){if(token!==introToken)return;screen='combatIntro';let g=new Chess(v.fen),start=i===2?to:from,fx=F.indexOf(start[0]),fy=+start[1]-1,dx=F.indexOf(to[0])-fx,dy=(+to[1]-1)-fy;let messages=k==='capture'?["A pawn walks straight, but takes an enemy diagonally. Watch the black pawn on d5.","Watch my white pawn travel from e4 to d5 and take that pawn’s square.","That was a diagonal capture. Now you can try it yourself."]:k==='escape'?["The black rook looks down the e-file at our king. That is check.","Watch our king step sideways from e1 to d1, away from the rook’s line.","Now the king is safe. Try a legal escape yourself."]:["A pawn near the other side has a special surprise.","Watch the pawn step from e7 to e8.","It can become a queen! Now you try the promotion."];let board=bd('combatDemoBoard',q=>{if(q===from)return i===2?'': '';if(i===2&&q===to)return k==='promotion'?'♕':piece;let p=g.get(q);return p?symbol(p):''}).replace('class="board"','class="board demo-board '+(i===1?'demo-walk':'')+'"');if(i!==2)board=board.replace('</div>','<span class="demo-piece" style="left:'+(fx*12.5)+'%;bottom:'+(fy*12.5)+'%;--move-x:'+(dx*100)+'%;--move-y:'+(-dy*100)+'%">'+piece+'</span></div>');set('<section class="p center"><span class="tag">Watch first · Chess battle school</span><h1>'+v.name+'</h1><p>Watch the rule before your turn.</p>'+board+'<p id="c" class="coach" aria-live="polite">'+messages[i]+'</p><div class="toolbar"><button onclick="combatIntro(\''+k+'\')">Show Again</button><button onclick="readCoach()">🔊 Hear this part</button>'+(i===2?'<button class="primary" onclick="combatLesson(\''+k+'\')">Now you try</button>':'')+'<button onclick="home()">Pause / Save & finish</button></div></section>');speakWarm(messages[i]);if(i<2)setTimeout(()=>{if(token===introToken&&screen==='combatIntro')scene(i+1)},5500);else{S.intros=S.intros||{};S.intros['combat_'+ function combatLesson(k,reset=false){screen='combat_'+k;if(typeof Chess==='undefined')return play();let v=COMBAT[k],g=new Chess(reset||!S.combatFen?.[k]?v.fen:S.combatFen[k]),selected=null;if(reset&&S.combatFen){delete S.combatFen[k];save()}function draw(msg){set('<section class="p center"><span class="tag">World 2 · Chess battle school</span><h1>'+v.name+'</h1><p>'+v.intro+'</p>'+bd('combatBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p id="c" class="coach" aria-live="polite">'+(msg||'Tap your white piece, then choose where it goes.')+'</p><div class="toolbar"><button onclick="combatHelp(\''+k+'\')">Help</button><button onclick="combatLesson(\''+k+'\',true)">Again</button><button onclick="combatLesson(\''+k+'\',true)">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('combatBoard',(q,b)=>{if(selected){let from=selected;selected=null;let move=g.move({from,to:q,promotion:'q'});if(!move){document.querySelector('#c').textContent='That move is not legal yet. Try a safe square, or ask Chessy for Help.';b.classList.add('bad');recordLearning(k,'mistakes');return}let goal=from+'-'+q===v.goal;if(goal){S.combatDone=S.combatDone||{};if(!S.combatDone[k])S.stars++;S.combatDone[k]=true;if(S.combatFen)delete S.combatFen[k];recordLearning(k,'success');save();return celebrate(k==='capture'?'You captured it!':k==='escape'?'King safe!':'A new queen!',k==='capture'?'Your pawn captured diagonally and took the black pawn’s square.':k==='escape'?'Your king stepped out of the rook’s line.':'Your pawn reached the far rank and became a queen.')}S.combatFen=S.combatFen||{};S.combatFen[k]=g.fen();save();recordLearning(k,'mistakes');return draw('That is a legal move. Look at what changed, then Rewind to try the mission again.')}let p=g.get(q);if(p&&p.color==='w'){selected=q;document.querySelector('#c').textContent='Now choose a legal landing square.'}else document.querySelector('#c').textContent='Choose one of your white pieces.'})}draw()}

function coachReview(){let moments=(S.review||[]).filter(x=>x&&typeof x==='object'&&x.fen&&x.fen.split(' ')[1]==='w').slice(-8);if(!moments.length){set('<section class="p"><h1>Coach Review</h1><p>Play a game first. Chessy will remember a move to revisit together.</p><button onclick="play()">Play</button></section>');return}let m=[...moments].reverse().find(x=>x.captured||x.check||/[x+#]/.test(x.san))||moments.at(-1),g=new Chess(m.fen),selected=null;S.reviewDone=true;save();let positive=m.captured?'You captured a piece with '+m.san+'.':m.check||/[+#]/.test(m.san)?'Your move '+m.san+' gave check.':m.to==='e4'||m.to==='d4'?'Your move '+m.san+' brought a pawn toward the center.':'You chose '+m.san+' in this position.';function draw(msg){set('<section class="p center"><span class="tag">Coach Review · one moment</span><h1>Let’s replay a choice</h1><p>'+positive+'</p>'+bd('reviewBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p class="coach" id="c" aria-live="polite">'+(msg||'Try another legal White move. Then notice what changed.')+'</p><div class="toolbar"><button onclick="coachReview()">Again</button><button onclick="document.querySelector(\'#c\').textContent=\'Choose a white piece, then a legal destination. Take your time.\'">Help</button><button onclick="coachReview()">Rewind</button><button onclick="play()">Play again</button><button onclick="home()">Finish for now</button></div></section>');hook('reviewBoard',(q,b)=>{if(selected){let move=g.move({from:selected,to:q,promotion:'q'});selected=null;if(move){let description=move.captured?'It captured a piece.':g.in_check()?'It gave check.':'The board changed, and your opponent would move next.';return draw('You tried '+move.san+'. '+description+' Your earlier move was '+m.san+'. Rewind to compare them.')}document.querySelector('#c').textContent='That move is not legal. Choose a different square.';b.classList.add('bad');return}let p=g.get(q);if(p&&p.color==='w'&&g.turn()==='w'){selected=q;document.querySelector('#c').textContent='Now choose a legal square for this piece.'}else document.querySelector('#c').textContent='Choose a white piece to explore.'})}draw()}

function retention(k){screen='retention_'+k;let rookSkill=k==='rook',from=rookSkill?'c3':'e4',to=rookSkill?'h3':'f6';set('<section class="p center"><span class="tag">A little memory adventure</span><h1>'+(rookSkill?'Rocky’s new road':'Klip-Klop’s new jump')+'</h1><p>It is okay to think again. Move your piece to the star.</p>'+bd('reviewSkillBoard',q=>q===from?(rookSkill?'♜':'♞'):q===to?'★':rookSkill&&q==='c5'?'🪨':'')+'<p id="c" class="coach" aria-live="polite">Try this new position. Help is always welcome.</p><div class="toolbar"><button onclick="document.querySelector(\'#c\').textContent=\''+(rookSkill?'Rocky travels along a row; the rock blocks his column.':'A knight can hop two squares, then one sideways.')+'\'">Help</button><button onclick="retention(\''+k+'\')">Again</button><button onclick="retention(\''+k+'\')">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('reviewSkillBoard',(q,b)=>{if(q!==to){recordLearning('retention_'+k,'mistakes');document.querySelector('#c').textContent='That is not the star yet. Look for '+to+'. Try again together.';b.classList.add('bad');return}S.reviewDue[k]=Date.now()+7*86400000;S.retained=S.retained||{};S.retained[k]=(S.retained[k]||0)+1;recordLearning('retention_'+k,'success');save();celebrate('You remembered!',rookSkill?'Rocky found a straight road in a new place.':'Klip-Klop found an L-shaped jump in a new place.')})}

function quietCheck(skill){let rookSkill=skill==='rook';set('<section class="p hero"><span class="tag">A quiet thought</span><h1>'+ (rookSkill?'Can Rocky travel through a rock?':'Can Klip-Klop jump over a piece?')+'</h1><p>Take your time. You can always ask Chessy for a clue.</p><div class="actions"><button onclick="answerCheck(\''+skill+'\',true)">Yes</button><button onclick="answerCheck(\''+skill+'\',false)">No</button></div><p id="c" class="coach" aria-live="polite">Think back to the tracks and jumps you tried.</p><button onclick="document.querySelector(\'#c\').textContent=\''+(rookSkill?'Rocky stops at a rock.':'Klip-Klop hops in an L.')+'\'">Help</button></section>')}
function answerCheck(skill,yes){let right=skill==='rook'?!yes:yes;if(!right){document.querySelector('#c').textContent='Let’s look back: '+(skill==='rook'?'Rocky stops when a rock blocks the track.':'Klip-Klop can hop over friends and obstacles.')+' Try once more.';return}S.checks=S.checks||{};S.checks[skill]=true;S.reviewDue=S.reviewDue||{};if(!S.reviewDue[skill])S.reviewDue[skill]=Date.now()+86400000;save();celebrate(skill==='rook'?'Rocky did it!':'Klip-Klop is proud!',skill==='rook'?'You used straight tracks and noticed the blocker.':'You found L-shaped jumps and remembered how they hop.')}
function celebrate(a,b){set('<section class="p hero"><div class="big">🎉</div><h1>'+a+'</h1><p>'+b+'</p><div class="actions"><button onclick="home()">Finish for now</button><button class="primary" onclick="next()">One more adventure</button><button onclick="play()">Free playground</button></div></section>')}
const MOVIE_TITLES={board:'Explore the chessboard',rook:'Meet Rocky the Rook',knight:'Meet Klip-Klop',bishop:'Meet Bea the Bishop',queen:'Meet the Queen',king:'Meet the King',pawn:'Meet the Pawn',capture:'Capture a piece',escape:'Escape check',promotion:'Meet your new Queen',penny:'Meet Penny Panda',foxy:'Try Foxy’s fork'};
const MOVIE_NARRATION={board:'Hi friend! This chessboard has light and dark squares. Letters go across; numbers climb. Let’s find one!',rook:'Meet Rocky! The rook rolls straight along rows and columns. A piece blocks the road. Your turn!',knight:'Meet Klip-Klop! A knight jumps two squares, then one sideways. It can hop over friends. Let’s try!',bishop:'Bea glides diagonally on one color. Pieces block her path. Can you find a diagonal?',queen:'The Queen travels straight or diagonally. She has many roads! Watch, then try a move.',king:'The King moves one square in any direction. Keep your king safe. Let’s try one careful step!',pawn:'Pawns walk forward. From their starting row, they may move one or two squares. Let’s try!',capture:'Pawns walk forward and capture diagonally. Watch this pawn take the one on d five. Your turn!',escape:'The rook checks the king. Step sideways off its straight road. The king is safe. Your turn!',promotion:'The pawn reaches the far side and becomes a queen. That is called promotion. Let’s try!',penny:'Penny says friends protect each other. The knight takes back the bishop. Who helped the pawn?',foxy:'A knight fork attacks two pieces! Jump in an L to check the king and attack the queen.'};
function playMovieVoice(key){let line=MOVIE_NARRATION[key];return line?speakWarm(line):false}
function showLessonVideo(key,begin,doneKey=key){let token=++introToken;screen='videoIntro';set('<section class="p center"><span class="tag">Watch first · Chessy’s mini movie</span><h1>'+(MOVIE_TITLES[key]||'Watch, then try')+'</h1><p id="movieStatus" class="coach" aria-live="polite">Loading your short video…</p><div id="movieSlot"></div><div class="toolbar"><button id="movieReplay" hidden>Watch with Chessy’s voice</button><button id="movieTry" class="primary" hidden>Now you try</button><button onclick="home()">Pause / Save & finish</button></div></section>');function render(){if(screen!=='videoIntro'||token!==introToken)return;let source=window.lessonVideos?.[key];if(!source){document.querySelector('#movieStatus').textContent='Video did not load. Tap Retry to try again.';document.querySelector('#movieSlot').innerHTML='<button id="movieRetry">Retry video</button>';document.querySelector('#movieRetry').onclick=()=>showLessonVideo(key,begin,doneKey);return}document.querySelector('#movieSlot').innerHTML='<video class="lesson-film" playsinline preload="auto" aria-label="Chess lesson animation"><source src="'+source+'" type="video/mp4">Your browser cannot play this video.</video>';let video=document.querySelector('.lesson-film'),again=document.querySelector('#movieReplay'),tryButton=document.querySelector('#movieTry'),narrationStarted=false;video.muted=true;video.controls=false;document.querySelector('#movieStatus').textContent='Tap the button to watch and hear Chessy explain the move. Captions are on the movie.';again.hidden=false;again.textContent='▶ Watch with Chessy’s voice';again.onclick=()=>{window.speechSynthesis?.cancel?.();video.muted=true;video.currentTime=0;narrationStarted=playMovieVoice(key);video.play().then(()=>{again.textContent='↻ Hear Chessy again';document.querySelector('#movieStatus').textContent=narrationStarted?'Listen to Chessy and watch the move.':'This browser cannot play spoken voice. Check device speech settings, or read the captions.'}).catch(()=>{document.querySelector('#movieStatus').textContent='Tap the button again to start the movie.'})};tryButton.onclick=()=>{window.speechSynthesis?.cancel?.();begin()};video.onended=()=>{window.speechSynthesis?.cancel?.();S.intros=S.intros||{};S.intros[doneKey]=true;save();tryButton.hidden=false;document.querySelector('#movieStatus').textContent=narrationStarted?'You watched and heard the lesson. Now you can try it!':'You watched the lesson. Voice did not start on this device; read the captions or try another browser.'};video.onerror=()=>{document.querySelector('#movieStatus').textContent='This video could not play. Use Watch with Chessy’s voice to retry.'}}if(window.lessonVideos?.[key])return render();let script=document.createElement('script');script.src='videos/'+key+'.js?v=3';script.onload=render;script.onerror=()=>{if(screen==='videoIntro'&&token===introToken)document.querySelector('#movieStatus').textContent='Video did not load. Please check your connection and try again.'};document.head.append(script)}
const originalWorld0=world0;
world0=function(){if(!S.intros?.board)return showLessonVideo('board',()=>world0());return originalWorld0()};
rockyIntro=function(){return showLessonVideo('rook',()=>rook())};
pieceIntro=function(k){return showLessonVideo(k,()=>beginPiece(k))};
combatIntro=function(k){return showLessonVideo(k,()=>combatLesson(k),'combat_'+k)};
pennyIntro=function(){return showLessonVideo('penny',()=>penny())};
foxyIntro=function(){return showLessonVideo('foxy',()=>foxy())};
home();
</script>
</body></html>
