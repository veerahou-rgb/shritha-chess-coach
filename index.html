<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chessy's Adventure</title><style>:root{--i:#17364c;--c:#fff8e7;--b:#177f9b;--l:#ffe99a;--m:#d5f1df;--g:#ffd354}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:18px system-ui}header{padding:.7rem max(1rem,calc((100% - 1000px)/2));display:flex;justify-content:space-between;background:#fff;border-bottom:3px solid var(--i)}main{max-width:1000px;margin:auto;padding:1.5rem 1rem 6rem}.p,.card{background:#fff;border:3px solid var(--i);border-radius:22px;padding:1.3rem;box-shadow:0 6px #17364c22}.hero{text-align:center}.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:1rem}button{font:inherit;font-weight:750;color:var(--i);background:#fff;border:3px solid var(--i);border-radius:14px;padding:.6rem .9rem;cursor:pointer;box-shadow:0 3px #17364c22}.primary{background:var(--g)}.tag,#stars{background:var(--m);border-radius:999px;padding:.25rem .65rem;font-weight:800}.actions,.toolbar{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}.coach{background:#e5f5ff;border:2px solid var(--i);border-radius:16px;padding:.7rem;max-width:650px;margin:1rem auto}.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,600px);aspect-ratio:1;border:5px solid var(--i);margin:1rem auto;border-radius:12px;overflow:hidden}.sq{position:relative;border:0;border-radius:0;box-shadow:none;padding:0;font-size:clamp(1.2rem,5vw,2.5rem)}.l{background:var(--l)}.d{background:var(--b)}.bad{animation:x .2s 2}@keyframes x{50%{transform:translateX(5px)}}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--i);padding:.5rem;display:flex;justify-content:center;gap:.5rem}.big{font-size:4rem}.center{text-align:center}@media(max-width:560px){body{font-size:16px}nav button{padding:.4rem}}</style></head><body><header><button onclick="home()">🦉 Chessy's Adventure</button><span id="stars">★ 0</span></header><main id="app"></main><nav><button onclick="home()">Home</button><button onclick="explore()">Explore</button><button onclick="play()">Play</button><button onclick="kingdom()">Kingdom</button></nav>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script><script>
const K='shrithaChessV2',F='abcdefgh';let S=JSON.parse(localStorage.getItem(K)||'{}');S={stars:0,world:0,rookDone:false,knightDone:false,...S};let L={rook:{p:'b2',z:['b6','f2','f6'],h:[]},knight:{p:'b1',z:['c3','d2','a3'],h:[]}};const A=document.querySelector('#app'),save=()=>{localStorage.setItem(K,JSON.stringify(S));document.querySelector('#stars').textContent='★ '+S.stars},set=h=>{A.innerHTML=h;save();scrollTo(0,0)},bd=(id,draw)=>{let h='<div id="'+id+'" class="board">';for(let r=8;r;r--)for(let f=0;f<8;f++){let q=F[f]+r;h+='<button class="sq '+((f+r)%2?'d':'l')+'" data-q="'+q+'">'+draw(q)+'</button>'}return h+'</div>'},hook=(id,fn)=>document.querySelector('#'+id).onclick=e=>{let q=e.target.dataset.q;if(q)fn(q,e.target)};

function home(){if(!localStorage.getItem(K))return welcome();let n=S.world===0?'Board Explorer':!S.rookDone?'Rocky the Rook':!S.knightDone?'Klip-Klop the Knight':'Timmy Turtle';set('<section class="p hero"><span class="tag">Your next helpful step</span><h1>'+n+' is ready!</h1><p>One small adventure at a time. Your stars stay forever.</p><button class="primary" onclick="next()">Continue Adventure</button></section><section class="grid"><article class="card"><h2>🎮 Play</h2><p>Real legal chess moves with Timmy.</p><button onclick="play()">Play</button></article><article class="card"><h2>🗺️ Explore</h2><p>Maps, puzzles, and playgrounds.</p><button onclick="explore()">Explore</button></article><article class="card"><h2>🏰 My Kingdom</h2><p>See your cumulative unlocks.</p><button onclick="kingdom()">Visit</button></article></section>')}

function welcome(){set('<section class="p hero"><div class="big">🦉</div><span class="tag">A calm chess adventure</span><h1>Hi! I’m Coach Chessy.</h1><p>Are you new to chess? Let’s play right away.</p><div class="actions"><button class="primary" onclick="S.world=0;save();world0()">I’m brand new</button><button onclick="S.world=1;save();rook()">I know a little</button><button onclick="S.world=2;save();knight()">I already play</button></div></section>')}

function next(){if(S.world===0)return world0();if(!S.rookDone)return rook();if(!S.knightDone)return knight();play()}

function world0(){let t='e4';set('<section class="p center"><span class="tag">World 0 · Board comfort</span><h1>Find '+t+'</h1><p>Letters go across. Numbers go up.</p>'+bd('b',q=>q===t?'?':'')+'<p id="c" class="coach">Tap the square Chessy named. Take your time.</p><div class="toolbar"><button onclick="document.querySelector(\'#c\').textContent=\'Find e along the bottom, then go up to 4.\'">Help</button><button onclick="world0()">Again</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(q===t){S.world=1;save();celebrate('Board explorer!','You found e4. Letters go across; numbers go up.')}else{document.querySelector('#c').textContent='That is '+q+'. Look for the letter, then the number.';e.classList.add('bad')}})}

function line(a,b){let x=F.indexOf(a[0]),y=+a[1],X=F.indexOf(b[0]),Y=+b[1];if(x!==X&&y!==Y)return false;let dx=Math.sign(X-x),dy=Math.sign(Y-y);for(x+=dx,y+=dy;x!==X||y!==Y;x+=dx,y+=dy)if(F[x]+y==='b4')return false;return true}

function rook(){let x=L.rook;set('<section class="p center"><span class="tag">World 1 · Rocky the Rook</span><h1>Collect Rocky’s track stars</h1><p>Rocky rolls straight, never through a rock.</p>'+bd('b',q=>q===x.p?'♜':q==='b4'?'🪨':x.z.includes(q)?'★':'')+'<p id="c" class="coach">Tap a star on Rocky’s straight track.</p><div class="toolbar"><button onclick="document.querySelector(\'#c\').textContent=\'Which star shares Rocky’s row or column?\'">Help</button><button onclick="L.rook={p:\'b2\',z:[\'b6\',\'f2\',\'f6\'],h:[]};rook()">Again</button><button onclick="L.rook.p=L.rook.h.pop()||L.rook.p;rook()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!line(x.p,q)){document.querySelector('#c').textContent='Rocky needs one straight track and cannot roll through the rock.';e.classList.add('bad');return}x.h.push(x.p);x.p=q;if(x.z.includes(q)){x.z=x.z.filter(z=>z!==q);S.stars++;if(!x.z.length){S.rookDone=true;S.world=2;save();return celebrate('Rocky did it!','You used straight tracks and noticed the blocker.')}}rook()})}

function knight(){let x=L.knight,ok=(a,b)=>Math.abs(F.indexOf(a[0])-F.indexOf(b[0]))*Math.abs(+a[1]-+b[1])===2;set('<section class="p center"><span class="tag">World 1 · Klip-Klop the Knight</span><h1>Jump in an L</h1><p>Two squares one way, one square sideways.</p>'+bd('b',q=>q===x.p?'♞':x.z.includes(q)?'★':'')+'<p id="c" class="coach">Tap an L-shaped landing star.</p><div class="toolbar"><button onclick="document.querySelector(\'#c\').textContent=\'Count two in one direction, then one sideways.\'">Help</button><button onclick="L.knight={p:\'b1\',z:[\'c3\',\'d2\',\'a3\'],h:[]};knight()">Again</button><button onclick="L.knight.p=L.knight.h.pop()||L.knight.p;knight()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!ok(x.p,q)){document.querySelector('#c').textContent='Not an L yet—two squares, then one sideways.';e.classList.add('bad');return}x.h.push(x.p);x.p=q;if(x.z.includes(q)){x.z=x.z.filter(z=>z!==q);S.stars++;if(!x.z.length){S.knightDone=true;S.world=3;save();return celebrate('Klip-Klop is proud!','You found L-shaped jumps.')}}knight()})}

function explore(){set('<section class="p"><span class="tag">Explore</span><h1>Nearby adventures</h1><section class="grid"><article class="card"><h2>World Map</h2><p>Board comfort → Rocky → Klip-Klop → later worlds.</p><button onclick="next()">Open next adventure</button></article><article class="card"><h2>Puzzle Adventure</h2><p>Rocky’s star rescue.</p><button onclick="rook()">Try it</button></article><article class="card"><h2>Playground</h2><p>Chess rules on or creative rules off.</p><button onclick="play()">Choose</button></article></section></section>')}

function kingdom(){set('<section class="p"><span class="tag">My Kingdom</span><h1>Your growing kingdom</h1><p>Stars are never spent or removed.</p><section class="grid"><article class="card"><h2>♜ Rocky’s bridge</h2><p>'+ (S.rookDone?'Unlocked!':'Collect Rocky’s stars.')+'</p></article><article class="card"><h2>♞ Klip-Klop’s stable</h2><p>'+(S.knightDone?'Unlocked!':'Complete Rocky to unlock.')+'</p></article><article class="card"><h2>🐢 Timmy’s pond</h2><p>Ready for a friendly full game.</p></article></section></section>')}

let G,chosen=null,gameMode='';
function play(){set('<section class="p"><span class="tag">Play</span><h1>Choose your board</h1><section class="grid"><article class="card"><h2>🐢 Timmy Turtle</h2><p>A real legal game. You are White and Timmy replies.</p><button class="primary" onclick="startGame(\'timmy\')">Play Timmy</button></article><article class="card"><h2>Chess Playground</h2><p>Full legal chess. You control both colors.</p><button onclick="startGame(\'free\')">Open board</button></article><article class="card"><h2>Toy Box</h2><p>Creative rules-off play is coming after full chess.</p><button onclick="rook()">Try a free Rocky puzzle</button></article><article class="card"><h2>Parent area</h2><p>Weekly real-board idea and learning record.</p><button onclick="parent()">Hold-to-enter gate</button></article></section></section>')}
function startGame(m){if(typeof Chess==='undefined'){set('<section class="p hero"><h1>Chess engine is loading</h1><p>Check your connection, then try again.</p><button onclick="play()">Back</button></section>');return}G=new Chess();gameMode=m;chosen=null;renderGame()}
function symbol(p){return ({wp:'♙',wr:'♖',wn:'♘',wb:'♗',wq:'♕',wk:'♔',bp:'♟',br:'♜',bn:'♞',bb:'♝',bq:'♛',bk:'♚'})[p.color+p.type]}
function renderGame(){let legal=chosen?G.moves({square:chosen,verbose:true}).map(m=>m.to):[];set('<section class="p center"><span class="tag">'+(gameMode==='timmy'?'Timmy Turtle game':'Chess Playground')+'</span><h1>'+ (G.turn()==='w'?'White to move':'Black to move')+'</h1>'+bd('game',q=>{let p=G.get(q);return p?symbol(p):''})+'<p id="c" class="coach">'+gameStatus()+'</p><div class="toolbar"><button onclick="rewindGame()">Rewind</button><button onclick="hintGame()">Help</button><button onclick="play()">Pause / Save & finish</button></div></section>');document.querySelector('#game').onclick=e=>{let q=e.target.dataset.q;if(!q)return;if(chosen&&legal.includes(q)){G.move({from:chosen,to:q,promotion:'q'});S.review=[...(S.review||[]),G.history().slice(-1)[0]].slice(-8);save();chosen=null;if(G.game_over())return endGame();renderGame();if(gameMode==='timmy'&&G.turn()==='b')setTimeout(timmy,400);return}let p=G.get(q);if(p&&p.color===G.turn()&&(gameMode==='free'||p.color==='w')){chosen=q;renderGame()}else{document.querySelector('#c').textContent='Choose a piece whose turn it is. Chessy keeps the rules safe.';e.target.classList.add('bad')}};document.querySelectorAll('#game [data-q]').forEach(x=>{if(x.dataset.q===chosen)x.style.outline='5px solid #f7836c';if(legal.includes(x.dataset.q))x.style.boxShadow='inset 0 0 0 6px #ffffff88'})}
function gameStatus(){if(G.in_checkmate())return 'Checkmate!';if(G.in_stalemate())return 'Stalemate is a tie.';if(G.in_draw())return 'This game is a draw.';if(G.in_check())return 'Check! Keep your king safe.';return gameMode==='timmy'&&G.turn()==='b'?'Timmy is thinking…':'Tap a piece, then a highlighted legal square.'}
function timmy(){if(G.game_over())return endGame();let a=G.moves();G.move(a[Math.floor(Math.random()*a.length)]);S.review=[...(S.review||[]),'Timmy: '+G.history().slice(-1)[0]].slice(-8);save();renderGame()}
function endGame(){S.stars++;save();celebrate(G.in_checkmate()&&G.turn()==='b'?'Amazing checkmate!':G.in_stalemate()?'A thoughtful tie!':'Game complete.','Coach Review saved a few moves for your next adventure.')}
function rewindGame(){G.undo();if(gameMode==='timmy')G.undo();chosen=null;renderGame()}
function hintGame(){let m=G.moves({verbose:true})[0];document.querySelector('#c').textContent=m?'Coach question: what if you try '+m.from+' to '+m.to+'?':'No legal move is available.'}
function parent(){set('<section class="p center"><h1>Parent area</h1><p>Hold the button for 2 seconds to enter.</p><button id="hold" class="primary">Hold to enter</button><p id="c" class="coach">A simple gate—not a math question.</p></section>');let h=document.querySelector('#hold'),t;h.onpointerdown=()=>{document.querySelector('#c').textContent='Keep holding…';t=setTimeout(dashboard,2000)};h.onpointerup=h.onpointerleave=()=>{clearTimeout(t);document.querySelector('#c').textContent='Hold for 2 seconds to enter.'}}
function dashboard(){set('<section class="p"><span class="tag">Parent Dashboard</span><h1>Shritha’s chess week</h1><section class="grid"><article class="card"><h2>Play together</h2><p>Put one rook on a real board and ask, “Can Rocky reach the star in one straight track?” Let Shritha show you.</p></article><article class="card"><h2>Chess Powers</h2><p>Board comfort: '+(S.world?'Strong':'Learning')+'<br>Rocky: '+(S.rookDone?'Mastered':'Learning')+'<br>Klip-Klop: '+(S.knightDone?'Strong':'Learning')+'</p></article><article class="card"><h2>Coach Review</h2><p>'+((S.review||[]).join(' · ')||'Play a game to see gentle review notes.')+'</p></article></section><button onclick="home()">Back to child home</button></section>')}

function celebrate(a,b){set('<section class="p hero"><div class="big">🎉</div><h1>'+a+'</h1><p>'+b+'</p><div class="actions"><button onclick="home()">Finish for now</button><button class="primary" onclick="next()">One more adventure</button><button onclick="play()">Free playground</button></div></section>')}home();
</script>
</body></html>
