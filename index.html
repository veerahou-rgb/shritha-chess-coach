<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chessy's Adventure</title><style>:root{--i:#17364c;--c:#fff8e7;--b:#177f9b;--l:#ffe99a;--m:#d5f1df;--g:#ffd354}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:18px system-ui}header{padding:.7rem max(1rem,calc((100% - 1000px)/2));display:flex;justify-content:space-between;background:#fff;border-bottom:3px solid var(--i)}main{max-width:1000px;margin:auto;padding:1.5rem 1rem 6rem}.p,.card{background:#fff;border:3px solid var(--i);border-radius:22px;padding:1.3rem;box-shadow:0 6px #17364c22}.hero{text-align:center}.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:1rem}button{font:inherit;font-weight:750;color:var(--i);background:#fff;border:3px solid var(--i);border-radius:14px;padding:.6rem .9rem;cursor:pointer;box-shadow:0 3px #17364c22}.primary{background:var(--g)}.tag,#stars{background:var(--m);border-radius:999px;padding:.25rem .65rem;font-weight:800}.actions,.toolbar{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}.coach{background:#e5f5ff;border:2px solid var(--i);border-radius:16px;padding:.7rem;max-width:650px;margin:1rem auto}.board{touch-action:none;display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,600px);aspect-ratio:1;border:5px solid var(--i);margin:1rem auto;border-radius:12px;overflow:hidden}.sq{position:relative;border:0;border-radius:0;box-shadow:none;padding:0;font-size:clamp(1.2rem,5vw,2.5rem)}.coord{position:absolute;bottom:2px;right:3px;font-size:clamp(.55rem,1.3vw,.8rem);font-weight:800;pointer-events:none;opacity:.75}.d .coord{color:white}.l{background:var(--l)}.d{background:var(--b)}.bad{animation:x .2s 2}@keyframes x{50%{transform:translateX(5px)}}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--i);padding:.5rem;display:flex;justify-content:center;gap:.5rem}.big{font-size:4rem}.center{text-align:center}body{background:radial-gradient(circle at 10% 4%,#fff0b9 0,transparent 32%),radial-gradient(circle at 90% 26%,#d9f4ee 0,transparent 35%),#fffaf0}header{position:sticky;top:0;z-index:4;box-shadow:0 4px 18px #17364c12}main h1{font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.12;letter-spacing:-.025em;margin:.7rem 0}main h2{font-size:1.35rem}.p,.card{box-shadow:0 10px 28px #17364c12,0 5px #17364c12}.card:nth-child(4n+1){background:#fff4d1}.card:nth-child(4n+2){background:#e7f8ed}.card:nth-child(4n+3){background:#e9f4ff}.card:nth-child(4n){background:#ffe9e3}button{transition:transform .15s,box-shadow .15s;min-height:48px}button:hover{transform:translateY(-2px);box-shadow:0 5px #17364c33}button:focus-visible{outline:4px solid #f7836c;outline-offset:2px}.sq{min-height:0}.sq:hover{transform:none;filter:brightness(1.12)}.board{box-shadow:0 12px 24px #17364c25}.hero{padding:clamp(1.5rem,5vw,3.5rem)}nav{box-shadow:0 -4px 18px #17364c13}.coach{line-height:1.45}@media(max-width:560px){body{font-size:16px}header{padding:.45rem}header button{font-size:.82rem}nav{justify-content:space-around;gap:.1rem}nav button{padding:.3rem;font-size:.8rem;min-height:44px}.board{width:min(92vw,600px)}.sq{font-size:clamp(1.2rem,6vw,2rem)}main{padding:1rem .6rem 6rem}.p,.card{padding:1rem}}</style></head><body><header><button onclick="home()">🦉 Chessy's Adventure</button><div class="actions" style="margin:0;align-items:center"><button aria-label="Repeat coach audio" onclick="readCoach()">🔊</button><span id="stars">★ 0</span></div></header><main id="app"></main><nav><button onclick="home()">Home</button><button onclick="explore()">Explore</button><button onclick="play()">Play</button><button onclick="kingdom()">Kingdom</button></nav>
<style>
/* Keep an entire board visible even when a browser uses a large zoom level. */
main:has(.board){padding-top:.6rem}
.p:has(.board){padding:.8rem}
.p:has(.board) h1{font-size:clamp(1.45rem,3vw,2rem);margin:.3rem 0}
.p:has(.board) p{margin:.45rem auto}
.p:has(.board) .board{width:min(92vw,560px,46dvh);margin:.55rem auto;grid-template-rows:repeat(8,minmax(0,1fr))}
.p:has(.board) .sq{color:#102f45;text-shadow:0 0 2px #fff,0 0 5px #fff}
.p:has(.board) .toolbar{margin-top:.5rem}
@media(max-width:560px){.p:has(.board) .board{width:min(94vw,46dvh)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script><script>
const K='shrithaChessV2',F='abcdefgh';let S=JSON.parse(localStorage.getItem(K)||'{}');S={stars:0,world:0,rookDone:false,knightDone:false,...S};let L=S.lessons||{rook:{p:'b2',z:['b6','f2','f6'],h:[]},knight:{p:'b1',z:['c3','d2','a3'],h:[]}};let screen='welcome';const A=document.querySelector('#app'),save=()=>{S.lessons=L;localStorage.setItem(K,JSON.stringify(S));document.querySelector('#stars').textContent='★ '+S.stars},set=h=>{A.innerHTML=h;save();scrollTo(0,0)},bd=(id,draw)=>{let h='<div id="'+id+'" class="board" role="group" aria-label="Chess board">';for(let r=8;r;r--)for(let f=0;f<8;f++){let q=F[f]+r;h+='<button aria-label="'+q+'" class="sq '+((f+r)%2?'d':'l')+'" data-q="'+q+'">'+draw(q)+(r===1?'<span class="coord">'+F[f]+'</span>':'')+(f===0?'<span class="coord" style="left:3px;right:auto;top:2px;bottom:auto">'+r+'</span>':'')+'</button>'}return h+'</div>'},hook=(id,fn)=>{let root=document.querySelector('#'+id),start=null,suppress=false;root.onpointerdown=e=>{start=e.target.closest('[data-q]')?.dataset.q};root.onpointerup=e=>{let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-q]'),q=target?.dataset.q,allowed=screen==='rook'?start===L.rook.p:screen==='knight'?start===L.knight.p:false;if(allowed&&q&&q!==start){suppress=true;fn(q,target);setTimeout(()=>suppress=false,0)}start=null};root.onclick=e=>{if(suppress)return;let q=e.target.closest('[data-q]')?.dataset.q;if(q)fn(q,e.target.closest('button'))}};

function home(){screen='home';if(!S.started)return welcome();let n=S.world===0?'Board Explorer':!S.rookDone?'Rocky the Rook':!S.checks?.rook?'Rocky’s quiet check':!S.knightDone?'Klip-Klop the Knight':!S.checks?.knight?'Klip-Klop’s quiet check':!S.pieceDone?.bishop?'Bea the Bishop':!S.pieceDone?.queen?'Queen’s roads':!S.pieceDone?.king?'King’s careful steps':!S.pieceDone?.pawn?'Pawn march':!S.combatDone?.capture?'Capture a pawn':!S.combatDone?.escape?'Escape check':!S.combatDone?.promotion?'Promote a pawn':!S.pennyDone?'Penny Panda':!S.stalemateDone?'Stalemate or checkmate?':!S.foxyDone?'Foxy’s challenge':!S.mateDone?'Finish Together':S.review?.length&&!S.reviewDone?'Coach Review':'Timmy Turtle';if(['rook','knight'].some(k=>S.reviewDue?.[k]&&Date.now()>=S.reviewDue[k]))n='A little memory adventure';set('<section class="p hero"><span class="tag">Your next helpful step</span><h1>'+n+' is ready!</h1><p>One small adventure at a time. Your stars stay forever.</p><button class="primary" onclick="next()">Continue Adventure</button></section><section class="grid"><article class="card"><h2>🎮 Play</h2><p>Real legal chess moves with Timmy.</p><button onclick="play()">Play</button></article><article class="card"><h2>🗺️ Explore</h2><p>Maps, puzzles, and playgrounds.</p><button onclick="explore()">Explore</button></article><article class="card"><h2>🏰 My Kingdom</h2><p>See your cumulative unlocks.</p><button onclick="kingdom()">Visit</button></article></section>')}

function welcome(){screen='welcome';set('<section class="p hero"><div class="big">🦉</div><span class="tag">A calm chess adventure</span><h1>Hi! I’m Coach Chessy.</h1><p>Are you new to chess? Let’s play right away.</p><div class="actions"><button class="primary" onclick="S.started=true;S.world=0;save();world0()">I’m brand new</button><button onclick="S.started=true;S.world=1;save();rook()">I know a little</button><button onclick="S.started=true;S.world=2;save();knight()">I already play</button></div></section>')}

function next(){if(S.world===0)return world0();for(let k of ['rook','knight'])if(S.reviewDue?.[k]&&Date.now()>=S.reviewDue[k])return retention(k);if(!S.rookDone)return rook();if(!S.checks?.rook)return quietCheck('rook');if(!S.knightDone)return knight();if(!S.checks?.knight)return quietCheck('knight');for(let k of ['bishop','queen','king','pawn'])if(!S.pieceDone?.[k])return pieceAdventure(k);for(let k of ['capture','escape','promotion'])if(!S.combatDone?.[k])return combatLesson(k);if(!S.pennyDone)return penny();if(!S.stalemateDone)return stalemateLesson();if(!S.foxyDone)return foxy();if(!S.mateDone)return finishing();if(S.review?.length&&!S.reviewDone)return coachReview();play()}

function world0(){screen='world0';let stage=S.boardStage??(S.world>0?2:0);S.boardStage=stage;S.boardPops=S.boardPops||[];if(stage<2){let light=stage===0,n=3-S.boardPops.length;set('<section class="p center"><span class="tag">World 0 · Board comfort</span><h1>Find '+(light?'light':'dark')+' squares</h1><p>The board has two colors. Tap '+n+' different '+(light?'light':'dark')+' square'+(n===1?'':'s')+'.</p>'+bd('b',q=>S.boardPops.includes(q)?'✨':'')+'<p id="c" class="coach" aria-live="polite">Choose a '+(light?'sunny light':'cool dark')+' square. There is no rush.</p><div class="toolbar"><button onclick="boardHelp()">Help</button><button onclick="S.boardPops=[];world0()">Again</button><button onclick="boardRewind()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{let f=F.indexOf(q[0]),r=+q[1],isLight=(f+r)%2===0;if(isLight===light&&!S.boardPops.includes(q)){S.boardPops.push(q);recordLearning('world0','success');if(S.boardPops.length===3){S.boardStage++;S.boardPops=[]}world0()}else{document.querySelector('#c').textContent=S.boardPops.includes(q)?'You found that one already. Try another square.':'That is a '+(isLight?'light':'dark')+' square. Find a '+(light?'light':'dark')+' one.';e.classList.add('bad');recordLearning('world0','mistakes')}});return}let t='e4';set('<section class="p center"><span class="tag">World 0 · Secret square names</span><h1>Find '+t+'</h1><p>Letters go across. Numbers go up.</p>'+bd('b',q=>'')+'<p id="c" class="coach" aria-live="polite">Tap the square Chessy named. Take your time.</p><div class="toolbar"><button onclick="boardHelp()">Help</button><button onclick="world0()">Again</button><button onclick="world0()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(q===t){S.world=Math.max(S.world,1);recordLearning('world0','success');save();celebrate('Board explorer!','You found e4. Letters go across; numbers go up.')}else{document.querySelector('#c').textContent='That is '+q+'. Look for the letter, then the number.';e.classList.add('bad');recordLearning('world0','mistakes')}})}
function boardHelp(){let stage=S.boardStage;recordLearning('world0','help');document.querySelector('#c').textContent=stage===0?'The pale gold squares are light. Try a8.':stage===1?'The blue squares are dark. Try a1.':'Find e along the bottom, then go up to 4.'}
function boardRewind(){if(S.boardPops?.length)S.boardPops.pop();world0()}

function line(a,b){let x=F.indexOf(a[0]),y=+a[1],X=F.indexOf(b[0]),Y=+b[1];if(a===b||b==='b4'||x!==X&&y!==Y)return false;let dx=Math.sign(X-x),dy=Math.sign(Y-y);for(x+=dx,y+=dy;x!==X||y!==Y;x+=dx,y+=dy)if(F[x]+y==='b4')return false;return true}

function rook(){screen='rook';let x=L.rook;set('<section class="p center"><span class="tag">World 1 · Rocky the Rook</span><h1>Collect Rocky’s track stars</h1><p>Rocky rolls straight, never through a rock.</p>'+bd('b',q=>q===x.p?'♜':q==='b4'?'🪨':x.z.includes(q)?'★':'')+'<p id="c" class="coach">Tap a star on Rocky’s straight track.</p><div class="toolbar"><button onclick="rookHelp()">Help</button><button onclick="L.rook={p:\'b2\',z:[\'b6\',\'f2\',\'f6\'],h:[]};rook()">Again</button><button onclick="L.rook.p=L.rook.h.pop()||L.rook.p;rook()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!line(x.p,q)){document.querySelector('#c').textContent='Rocky needs one straight track and cannot roll through the rock.';e.classList.add('bad');recordLearning('rook','mistakes');return}x.h.push(x.p);x.p=q;if(x.z.includes(q)){x.z=x.z.filter(z=>z!==q);recordLearning('rook','success');if(!S.rookDone)S.stars++;if(!x.z.length){S.rookDone=true;S.world=Math.max(2,S.world);save();return quietCheck('rook')}}rook()})}

function knight(){screen='knight';let x=L.knight,ok=(a,b)=>Math.abs(F.indexOf(a[0])-F.indexOf(b[0]))*Math.abs(+a[1]-+b[1])===2;set('<section class="p center"><span class="tag">World 1 · Klip-Klop the Knight</span><h1>Jump in an L</h1><p>Two squares one way, one square sideways.</p>'+bd('b',q=>q===x.p?'♞':x.z.includes(q)?'★':'')+'<p id="c" class="coach">Tap an L-shaped landing star.</p><div class="toolbar"><button onclick="knightHelp()">Help</button><button onclick="L.knight={p:\'b1\',z:[\'c3\',\'d2\',\'a3\'],h:[]};knight()">Again</button><button onclick="L.knight.p=L.knight.h.pop()||L.knight.p;knight()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!ok(x.p,q)){document.querySelector('#c').textContent='Not an L yet—two squares, then one sideways.';e.classList.add('bad');recordLearning('knight','mistakes');return}x.h.push(x.p);x.p=q;if(x.z.includes(q)){x.z=x.z.filter(z=>z!==q);recordLearning('knight','success');if(!S.knightDone)S.stars++;if(!x.z.length){S.knightDone=true;S.world=Math.max(3,S.world);save();return quietCheck('knight')}}knight()})}

function rookHelp(){let x=L.rook,n=S.learning?.rook?.help||0,target=x.z.find(z=>line(x.p,z));document.querySelector('#c').textContent=n===0?'Which star shares Rocky’s row or column?':n===1?'Look for a star on an open straight track. The rock on b4 blocks Rocky.':target?'Show Again: Rocky can move from '+x.p+' straight to '+target+'. You can try it now.':'Show Again: Rocky can first roll to a clear square, then turn toward the next star.'}
function knightHelp(){let x=L.knight,n=S.learning?.knight?.help||0,target=x.z.find(z=>Math.abs(F.indexOf(x.p[0])-F.indexOf(z[0]))*Math.abs(+x.p[1]-+z[1])===2);document.querySelector('#c').textContent=n===0?'Count two in one direction, then one sideways.':n===1?'Klip-Klop can hop over pieces. Look for an L from '+x.p+'.':target?'Show Again: from '+x.p+' hop to '+target+'. You can try it.':'Show Again: take an L jump to a new square, then look for the star.'}

const PIECES={bishop:{name:'Bea the Bishop',piece:'♗',start:'c1',targets:['e3','g5','h6'],hint:'Bea glides corner to corner and stays on the same square color.',intro:'Glide diagonally to each star.'},queen:{name:'Queen’s roads',piece:'♕',start:'d1',targets:['d4','g4','h5'],hint:'The queen can use straight tracks or diagonal trails.',intro:'Try both straight and diagonal roads.'},king:{name:'King’s careful steps',piece:'♔',start:'e1',targets:['e2','f3','g4'],hint:'The king steps just one square in any direction.',intro:'Walk one careful step at a time.'},pawn:{name:'Pawn march',piece:'♙',start:'e2',targets:['e4','e5','e6','e7','e8'],hint:'A pawn moves forward. On its first move, it may go two squares.',intro:'March forward to the other side.'}};
function pieceLegal(k,a,b){let dx=Math.abs(F.indexOf(a[0])-F.indexOf(b[0])),dy=Math.abs(+a[1]-+b[1]);if(!dx&&!dy)return false;if(k==='bishop')return dx===dy;if(k==='queen')return dx===dy||dx===0||dy===0;if(k==='king')return dx<=1&&dy<=1;if(k==='pawn')return dx===0&&(+b[1]-+a[1]===1||a[1]==='2'&&+b[1]-+a[1]===2);return false}
function pieceAdventure(k){screen='piece_'+k;let spec=PIECES[k],x=L[k]||(L[k]={p:spec.start,z:[...spec.targets],h:[]});set('<section class="p center"><span class="tag">World 1 · Piece friends</span><h1>'+spec.name+'</h1><p>'+spec.intro+'</p>'+bd('b',q=>q===x.p?spec.piece:q===x.z[0]?'★':'')+'<p id="c" class="coach" aria-live="polite">Move to the next star. Take your time.</p><div class="toolbar"><button onclick="pieceHelp(\''+k+'\')">Help</button><button onclick="L.'+k+'={p:PIECES.'+k+'.start,z:[...PIECES.'+k+'.targets],h:[]};pieceAdventure(\''+k+'\')">Again</button><button onclick="pieceRewind(\''+k+'\')">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('b',(q,e)=>{if(!pieceLegal(k,x.p,q)){document.querySelector('#c').textContent=spec.hint;e.classList.add('bad');recordLearning(k,'mistakes');return}x.h.push({p:x.p,z:[...x.z]});x.p=q;if(q===x.z[0]){x.z.shift();recordLearning(k,'success');if(!x.z.length){S.pieceDone=S.pieceDone||{};if(!S.pieceDone[k])S.stars++;S.pieceDone[k]=true;save();return celebrate(spec.name+' did it!',k==='pawn'?'Your pawn reached the far side and can become a queen!':'You learned how this piece moves.')}}pieceAdventure(k)})}
function pieceRewind(k){let x=L[k],old=x.h.pop();if(old){x.p=old.p;x.z=old.z}pieceAdventure(k)}
function pieceHelp(k){let x=L[k],v=S.learning?.[k]?.help||0;recordLearning(k,'help');document.querySelector('#c').textContent=v===0?PIECES[k].hint:v===1?'Look for '+x.z[0]+'. It is the next star.':'Show Again: from '+x.p+' move to '+x.z[0]+'. Help is always welcome.'}

function explore(){screen='explore';set('<section class="p"><span class="tag">Explore</span><h1>Choose a nearby adventure</h1><section class="grid"><article class="card"><h2>🗺️ World Map</h2><p>Visit places you have met and see what comes next.</p><button onclick="worldMap()">Open map</button></article><article class="card"><h2>🧩 Puzzle Adventure</h2><p>Try a short rescue, fork, or finishing puzzle.</p><button onclick="puzzleAdventure()">Open puzzles</button></article><article class="card"><h2>🎨 Playground</h2><p>Chess rules on or creative rules off.</p><button onclick="play()">Choose a board</button></article></section></section>')}
function worldMap(){screen='map';set('<section class="p"><span class="tag">Nearby Adventure Map</span><h1>Your chess journey</h1><p>Visit familiar places whenever you want. Your stars stay with you.</p><section class="grid"><article class="card"><h2>🌱 Board Grove</h2><p>World 0 · Squares and directions</p><button onclick="world0()">Explore squares</button></article><article class="card"><h2>♜ Rocky’s tracks</h2><p>World 1 · Straight roads and a rock</p><button onclick="rook()">Visit Rocky</button></article><article class="card"><h2>♞ Klip-Klop’s meadow</h2><p>World 1 · L-shaped jumps</p><button onclick="knight()">Visit Klip-Klop</button></article><article class="card"><h2>✨ Piece friends</h2><p>Meet bishop, queen, king, and pawn.</p><button onclick="pieceAdventure(\'bishop\')">Meet Bea</button></article><article class="card"><h2>⚔️ Battle school</h2><p>World 2 · Capture, escape check, and promote.</p><button onclick="combatLesson(\'capture\',true)">Capture</button> <button onclick="combatLesson(\'escape\',true)">Escape</button> <button onclick="combatLesson(\'promotion\',true)">Promote</button></article><article class="card"><h2>🐼 Penny’s garden</h2><p>World 2 · Pieces protect friends.</p><button onclick="penny()">Visit Penny</button></article><article class="card"><h2>🦊 Foxy’s hill</h2><p>World 3 · A fork and a real checkmate.</p><button onclick="foxy()">Visit Foxy</button></article></section><div class="toolbar"><button onclick="explore()">Back to Explore</button><button class="primary" onclick="next()">Continue Adventure</button></div></section>')}
function puzzleAdventure(){screen='puzzles';set('<section class="p"><span class="tag">Puzzle Adventure</span><h1>Pick a little puzzle</h1><p>Take your time. Help and Rewind are welcome.</p><section class="grid"><article class="card"><h2>♜ Rocky’s rescue</h2><p>Collect stars without rolling through a rock.</p><button onclick="rook()">Play</button></article><article class="card"><h2>♞ Foxy’s fork</h2><p>Jump to attack two pieces at once.</p><button onclick="foxy()">Play</button></article><article class="card"><h2>♕ Finish Together</h2><p>Find a real checkmate.</p><button onclick="finishing(true)">Play</button>'+(S.finishFen?'<button onclick="finishing()">Resume saved puzzle</button>':'')+'</article></section><button onclick="explore()">Back to Explore</button></section>')}

function kingdom(){set('<section class="p"><span class="tag">My Kingdom</span><h1>Your growing kingdom</h1><p>Stars are never spent or removed.</p><button onclick="powers()">My Chess Powers</button><section class="grid"><article class="card"><h2>♜ Rocky’s bridge</h2><p>'+ (S.rookDone?'Unlocked!':'Collect Rocky’s stars.')+'</p></article><article class="card"><h2>♞ Klip-Klop’s stable</h2><p>'+(S.knightDone?'Unlocked!':'Complete Rocky to unlock.')+'</p></article><article class="card"><h2>⚔️ Battle school</h2><p>World 2 · Capture, escape check, and promote.</p><button onclick="combatLesson(\'capture\',true)">Capture</button> <button onclick="combatLesson(\'escape\',true)">Escape</button> <button onclick="combatLesson(\'promotion\',true)">Promote</button></article><article class="card"><h2>🐼 Penny’s garden</h2><p>'+(S.pennyDone?'Unlocked!':'Learn how pieces protect friends.')+'</p></article><article class="card"><h2>🦊 Foxy’s hill</h2><p>'+(S.foxyDone?'Unlocked!':'Find a clever knight fork.')+'</p></article></section></section>')}
function powers(){set('<section class="p"><span class="tag">My Chess Powers</span><h1>Look what you are learning</h1><p>Skills grow with practice. There is no timer.</p><div class="grid"><article class="card">Board squares: '+(S.world>0?'Strong':'Learning')+'</article><article class="card">Straight rook tracks: '+(S.rookDone&&S.checks?.rook?'Strong':'Learning')+'</article><article class="card">Knight jumps: '+(S.knightDone&&S.checks?.knight?'Strong':'Learning')+'</article><article class="card">Protecting friends: '+(S.pennyDone?'Strong':'Learning')+'</article><article class="card">Clever forks: '+(S.foxyDone?'Strong':'Learning')+'</article></div><button onclick="kingdom()">Back to kingdom</button></section>')}
const COMBAT={capture:{name:'Capture a pawn',fen:'4k3/8/8/3p4/4P3/8/8/4K3 w - - 0 1',goal:'e4-d5',intro:'Pawns walk straight but capture one step diagonally. Move the white pawn to take the black pawn.',hint:'The black pawn is on d5. Your white pawn starts on e4.'},escape:{name:'Escape check',fen:'4r2k/8/8/8/8/8/8/4K3 w - - 0 1',goal:'e1-d1',intro:'The black rook checks your king down the e-file. Step to a safe square.',hint:'Your king can step one square sideways, away from the rook’s e-file.'},promotion:{name:'Promote a pawn',fen:'k7/4P3/8/8/8/8/8/7K w - - 0 1',goal:'e7-e8',intro:'A pawn at the far end can become a queen. Move the pawn forward.',hint:'The white pawn on e7 is one step from e8.'}};
function combatLesson(k,reset=false){screen='combat_'+k;if(typeof Chess==='undefined')return play();let v=COMBAT[k],g=new Chess(reset||!S.combatFen?.[k]?v.fen:S.combatFen[k]),selected=null;if(reset&&S.combatFen){delete S.combatFen[k];save()}function draw(msg){set('<section class="p center"><span class="tag">World 2 · Chess battle school</span><h1>'+v.name+'</h1><p>'+v.intro+'</p>'+bd('combatBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p id="c" class="coach" aria-live="polite">'+(msg||'Tap your white piece, then choose where it goes.')+'</p><div class="toolbar"><button onclick="combatHelp(\''+k+'\')">Help</button><button onclick="combatLesson(\''+k+'\',true)">Again</button><button onclick="combatLesson(\''+k+'\',true)">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('combatBoard',(q,b)=>{if(selected){let from=selected;selected=null;let move=g.move({from,to:q,promotion:'q'});if(!move){document.querySelector('#c').textContent='That move is not legal yet. Try a safe square, or ask Chessy for Help.';b.classList.add('bad');recordLearning(k,'mistakes');return}let goal=from+'-'+q===v.goal;if(goal){S.combatDone=S.combatDone||{};if(!S.combatDone[k])S.stars++;S.combatDone[k]=true;if(S.combatFen)delete S.combatFen[k];recordLearning(k,'success');save();return celebrate(k==='capture'?'You captured it!':k==='escape'?'King safe!':'A new queen!',k==='capture'?'Your pawn captured diagonally and took the black pawn’s square.':k==='escape'?'Your king stepped out of the rook’s line.':'Your pawn reached the far rank and became a queen.')}S.combatFen=S.combatFen||{};S.combatFen[k]=g.fen();save();recordLearning(k,'mistakes');return draw('That is a legal move. Look at what changed, then Rewind to try the mission again.')}let p=g.get(q);if(p&&p.color==='w'){selected=q;document.querySelector('#c').textContent='Now choose a legal landing square.'}else document.querySelector('#c').textContent='Choose one of your white pieces.'})}draw()}
function combatHelp(k){recordLearning(k,'help');let n=S.learning?.[k]?.help||1,v=COMBAT[k];document.querySelector('#c').textContent=n===1?v.hint:n===2?'Find the square '+v.goal.split('-')[1]+'. Think about how the piece gets there.':'Show Again: move from '+v.goal.replace('-', ' to ')+'. You can try it yourself.'}
function stalemateLesson(){screen='stalemate';if(typeof Chess==='undefined')return play();let g=new Chess('7k/5K2/6Q1/8/8/8/8/8 b - - 0 1');set('<section class="p center"><span class="tag">World 2 · Draws</span><h1>Is this checkmate or a tie?</h1><p>Black to move. The king is not in check. Look for a safe move.</p>'+bd('staleBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p id="c" class="coach" aria-live="polite">Choose what happened to the black king.</p><div class="actions"><button onclick="answerStalemate(false)">Checkmate</button><button onclick="answerStalemate(true)">Tie · stalemate</button></div><div class="toolbar"><button onclick="document.querySelector(\'#c\').textContent=\'The king is safe right now, but has no legal square.\'">Help</button><button onclick="stalemateLesson()">Again</button><button onclick="stalemateLesson()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>')}
function answerStalemate(tie){if(!tie){document.querySelector('#c').textContent='Not checkmate: the king is not being checked. Can you find any legal move?';recordLearning('stalemate','mistakes');return}S.stalemateDone=true;if(!S.stalemateStar){S.stars++;S.stalemateStar=true}recordLearning('stalemate','success');save();celebrate('You spotted a tie!','No check and no legal move means stalemate. Nobody wins this one.')}

function penny(){screen='penny';set('<section class="p center"><span class="tag">World 2 · Penny Panda</span><h1>Who protects the pawn?</h1><p>A bishop is looking at the white pawn on e4. Find the white piece that protects it.</p>'+bd('pennyBoard',q=>({e1:'♔',e8:'♚',b7:'♝',e4:'♙',c3:'♘'})[q]||'')+'<p id="c" class="coach" aria-live="polite">Tap the friendly helper. Take your time.</p><div class="toolbar"><button onclick="penny()">Again</button><button onclick="document.querySelector(\'#c\').textContent=\'A knight on c3 jumps in an L to e4.\'">Help</button><button onclick="penny()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('pennyBoard',(q,b)=>{if(q==='c3'){if(!S.pennyDone)S.stars++;S.pennyDone=true;S.world=Math.max(S.world,4);save();celebrate('Penny found a protector!','Your knight on c3 can help the pawn on e4.')}else{document.querySelector('#c').textContent=q==='e4'?'That pawn needs help. Which friend can jump to e4?':'Try the white knight. It protects a square in an L.';b.classList.add('bad')}})}
function foxy(){screen='foxy';if(typeof Chess==='undefined')return play();let g=new Chess('4k3/3q4/8/3N4/8/8/8/4K3 w - - 0 1'),pick=false;set('<section class="p center"><span class="tag">World 3 · Foxy’s challenge</span><h1>A fork with one jump</h1><p>Move the white knight so it checks the king and also looks at the queen.</p>'+bd('foxyBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p id="c" class="coach" aria-live="polite">Tap the knight, then its new square.</p><div class="toolbar"><button onclick="foxy()">Again</button><button onclick="document.querySelector(\'#c\').textContent=\'From d5, jump two squares to the right and one up.\'">Help</button><button onclick="foxy()">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('foxyBoard',(q,b)=>{if(!pick){if(q==='d5'){pick=true;document.querySelector('#c').textContent='Now find the landing square for the fork.'}else document.querySelector('#c').textContent='Find the white knight on d5 first.';return}if(q==='f6'){if(!S.foxyDone)S.stars++;S.foxyDone=true;S.world=Math.max(S.world,5);save();celebrate('A clever fork!','From f6, the knight checks the king on e8 and attacks the queen on d7.')}else{pick=false;document.querySelector('#c').textContent='That jump does not fork both pieces. Look for f6.';b.classList.add('bad')}})}

const MATE_FEN='7k/8/5KQ1/8/8/8/8/8 w - - 0 1';let finishBoard,finishSelected=null;
function finishing(reset=false){screen='finishing';if(typeof Chess==='undefined')return play();if(reset){S.finishFen=null;save()}if(reset||!finishBoard)finishBoard=new Chess(S.finishFen||MATE_FEN);finishSelected=null;drawFinishing()}
function drawFinishing(message){let g=finishBoard;set('<section class="p center"><span class="tag">World 3 · Finish Together</span><h1>Can you make checkmate?</h1><p>White moves. Checkmate means check with no safe escape.</p>'+bd('finishBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p id="c" class="coach" aria-live="polite">'+(message||'Tap a white piece, then its new square. Chessy will check the rules.')+'</p><div class="toolbar"><button onclick="finishHelp()">Help</button><button onclick="finishing(true)">Again</button><button onclick="finishing(true)">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('finishBoard',(q,b)=>{if(finishSelected){let from=finishSelected;finishSelected=null;let move=g.move({from,to:q,promotion:'q'});if(!move){document.querySelector('#c').textContent='The rules keep that move safe. Try a different square or ask for Help.';b.classList.add('bad');recordLearning('finish','mistakes');return}S.finishFen=g.fen();save();if(g.in_checkmate()){S.finishFen=null;if(!S.mateDone)S.stars+=3;S.mateDone=true;save();return celebrate('Real checkmate!','Your queen gives check and the king has no safe move. You earned this!')}recordLearning('finish','mistakes');return drawFinishing(g.in_check()?'That is check, but the king can still escape. Rewind and look again.':'That move is legal. What can the black king do next? Rewind and try another.')}let p=g.get(q);if(p&&p.color==='w'){finishSelected=q;document.querySelector('#c').textContent='Choose a legal landing square for this piece.'}else document.querySelector('#c').textContent='White moves first. Choose your white queen or king.'})}
function finishHelp(){recordLearning('finish','help');let n=S.learning?.finish?.help||1;document.querySelector('#c').textContent=n===1?'The queen can slide to a square near the black king. Which square will also cover its exits?':n===2?'Look along the g-file. Your king on f6 helps guard the queen.':'Show Again: move the queen from g6 to g7. Then notice why the black king cannot escape.'}

let G,chosen=null,gameMode='';
function play(){screen='play';set('<section class="p"><span class="tag">Play</span><h1>Choose your board</h1>'+(S.game?'<p><button class="primary" onclick="resumeGame()">Resume saved game</button></p>':'')+'<section class="grid"><article class="card"><h2>🐢 Timmy Turtle</h2><p>A real legal game. You are White and Timmy replies.</p><button class="primary" onclick="startGame(\'timmy\')">Play Timmy</button></article><article class="card"><h2>🦊 Foxy Challenge</h2><p>A quieter game with no live hints. Review a move afterward.</p><button onclick="startGame(\'challenge\')">Try challenge</button></article><article class="card"><h2>Chess Playground</h2><p>Full legal chess. You control both colors.</p><button onclick="startGame(\'free\')">Open board</button></article><article class="card"><h2>Toy Box</h2><p>Creative rules off: make up your own positions.</p><button onclick="toy()">Open Toy Box</button></article><article class="card"><h2>Parent area</h2><p>Weekly real-board idea and learning record.</p><button onclick="parent()">Hold-to-enter gate</button></article></section></section>')}
function startGame(m){if(typeof Chess==='undefined'){set('<section class="p hero"><h1>Chess engine is loading</h1><p>Check your connection, then try again.</p><button onclick="play()">Back</button></section>');return}G=new Chess();gameMode=m;chosen=null;S.game={mode:m,pgn:''};save();renderGame()}
function resumeGame(){if(typeof Chess==='undefined')return play();G=new Chess();try{if(S.game?.pgn&&!G.load_pgn(S.game.pgn))throw Error('invalid saved game');gameMode=S.game?.mode||'timmy';chosen=null;renderGame();if(gameMode!=='free'&&G.turn()==='b')setTimeout(timmy,400)}catch(e){S.game=null;save();play()}}
function persistGame(){S.game={mode:gameMode,pgn:G.pgn()};save()}
function symbol(p){return ({wp:'♙',wr:'♖',wn:'♘',wb:'♗',wq:'♕',wk:'♔',bp:'♟',br:'♜',bn:'♞',bb:'♝',bq:'♛',bk:'♚'})[p.color+p.type]}
function renderGame(){screen='game';let legal=chosen?G.moves({square:chosen,verbose:true}).map(m=>m.to):[];set('<section class="p center"><span class="tag">'+(gameMode==='timmy'?'Timmy Turtle game':gameMode==='challenge'?'Foxy Challenge':'Chess Playground')+'</span><h1>'+ (G.turn()==='w'?'White to move':'Black to move')+'</h1>'+bd('game',q=>{let p=G.get(q);return p?symbol(p):''})+'<p id="c" class="coach" aria-live="polite">'+gameStatus()+'</p><div class="toolbar"><button onclick="rewindGame()">Rewind</button><button onclick="hintGame()">Help</button><button onclick="readCoach()">🔊 Repeat</button><button onclick="play()">Pause / Save & finish</button></div></section>');document.querySelector('#game').onclick=e=>{let q=e.target.closest('[data-q]')?.dataset.q;if(!q)return;if(gameMode!=='free'&&G.turn()==='b')return;if(chosen&&legal.includes(q)){let before=G.fen();let move=G.move({from:chosen,to:q,promotion:'q'});if(move.color==='w'){S.review=[...(S.review||[]),{fen:before,san:move.san,from:chosen,to:q,captured:!!move.captured,check:G.in_check()}].slice(-8);S.reviewDone=false}persistGame();chosen=null;if(G.game_over())return endGame();renderGame();if(gameMode!=='free'&&G.turn()==='b')setTimeout(timmy,400);return}let p=G.get(q);if(p&&p.color===G.turn()&&(gameMode==='free'||p.color==='w')){chosen=q;renderGame()}else{document.querySelector('#c').textContent='Choose a piece whose turn it is. Chessy keeps the rules safe.';e.target.closest('button').classList.add('bad')}};document.querySelectorAll('#game [data-q]').forEach(x=>{if(x.dataset.q===chosen)x.style.outline='5px solid #f7836c';if(legal.includes(x.dataset.q))x.style.boxShadow='inset 0 0 0 6px #ffffff88'})}
function gameStatus(){if(G.in_checkmate())return 'Checkmate!';if(G.in_stalemate())return 'Stalemate is a tie.';if(G.in_draw())return 'This game is a draw.';if(G.in_check())return 'Check! Keep your king safe.';return gameMode!=='free'&&G.turn()==='b'?(gameMode==='challenge'?'Foxy is thinking…':'Timmy is thinking…'):'Tap a piece, then a highlighted legal square.'}
function timmy(){if(screen!=='game'||!G||gameMode==='free'||G.turn()!=='b'||G.game_over())return;let a=G.moves({verbose:true}),m=gameMode==='challenge'?[...a].sort((x,y)=>((y.captured?({p:1,n:3,b:3,r:5,q:9})[y.captured]:0)-(x.captured?({p:1,n:3,b:3,r:5,q:9})[x.captured]:0)))[0]:a[Math.floor(Math.random()*a.length)];G.move(m.san);S.review=[...(S.review||[]),(gameMode==='challenge'?'Foxy: ':'Timmy: ')+G.history().slice(-1)[0]].slice(-8);persistGame();if(G.game_over())return endGame();renderGame()}
function endGame(){let mate=G.in_checkmate(),whiteWon=mate&&G.turn()==='b',tie=G.in_draw();S.game=null;S.lastGame=G.pgn();S.stars+=whiteWon?3:tie?1:0;save();let title=whiteWon?'You made checkmate!':mate?(gameMode==='timmy'?'Timmy made checkmate. Let’s learn together.':gameMode==='challenge'?'Foxy made checkmate. Let’s learn together.':'Black made checkmate. Let’s learn together.'):G.in_stalemate()?'Stalemate: a tie!':'That was a draw.';set('<section class="p hero"><h1>'+title+'</h1><p>'+ (whiteWon?'Your king and helpers worked together.':tie?'Neither side won. We can explore the last moves.':'It can happen to every chess player. Let’s look at one helpful move.')+'</p><div class="actions"><button onclick="coachReview()">Coach Review</button><button onclick="startGame(\'timmy\')">Rematch</button><button onclick="home()">Finish for now</button></div></section>')}
function rewindGame(){if(gameMode!=='free'&&G.turn()==='w')G.undo();G.undo();chosen=null;persistGame();renderGame()}
function hintGame(){if(gameMode==='challenge'){document.querySelector('#c').textContent='Chessy is quietly watching. After the game, we can explore one move together.';return}let m=G.moves({verbose:true})[0];document.querySelector('#c').textContent=m?'Coach question: what if you try '+m.from+' to '+m.to+'?':'No legal move is available.'}
function speakWarm(text){if(!('speechSynthesis'in window))return;let voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));let preferred=voices.find(v=>/natural|neural|samantha|jenny|aria|karen|google us english/i.test(v.name))||voices.find(v=>/female/i.test(v.name))||voices[0];let u=new SpeechSynthesisUtterance(text.replace(/[★🎉🦉]/g,''));if(preferred)u.voice=preferred;u.lang=preferred?.lang||'en-US';u.rate=.86;u.pitch=1.12;u.volume=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
function readCoach(){let text=document.querySelector('#c')?.textContent||document.querySelector('main h1')?.textContent||'';speakWarm(text)}
function recordLearning(kind,event){S.learning=S.learning||{};let v=S.learning[kind]||{help:0,mistakes:0,success:0};v[event]=(v[event]||0)+1;v.mistakeRun=event==='mistakes'?(v.mistakeRun||0)+1:event==='success'?0:v.mistakeRun||0;S.learning[kind]=v;save();if(v.mistakeRun>=3&&event==='mistakes'){let c=document.querySelector('#c');if(c)c.textContent='Let’s try a smaller step together. Tap Help and Chessy will show a clue.'}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(b&&b.textContent.trim()==='Help'&&['rook','knight','world0','penny','foxy'].includes(screen))recordLearning(screen,'help')});
function toy(reset=false){screen='toy';let P=reset?null:S.toy;if(!P){P={};let w='♖♘♗♕♔♗♘♖',b='♜♞♝♛♚♝♞♜';for(let i=0;i<8;i++){P[F[i]+'1']=w[i];P[F[i]+'2']='♙';P[F[i]+'7']='♟';P[F[i]+'8']=b[i]}S.toy=P;S.toyHistory=[];save()}let H=S.toyHistory||[],pick=null;function draw(msg){set('<section class="p center"><span class="tag">Toy Box · rules off</span><h1>Make your own chess story</h1>'+bd('toy',q=>P[q]||'')+'<p id="c" class="coach" aria-live="polite">'+(msg||'Tap any piece, then any square. You can even make up captures.')+'</p><div class="toolbar"><button onclick="toy(true)">Again</button><button onclick="document.querySelector(\'#c\').textContent=\'Choose a piece, then tap its new square. Any destination is allowed.\'">Help</button><button onclick="rewindToy()">Rewind</button><button onclick="play()">Finish for now</button></div></section>');document.querySelector('#toy').onclick=e=>{let q=e.target.closest('[data-q]')?.dataset.q;if(!q)return;if(pick){if(q!==pick){H.push({...P});P[q]=P[pick];delete P[pick];S.toy=P;S.toyHistory=H;save();pick=null;draw('You made a move in your own chess story. What happens next?')}else{pick=null;draw('Choose another piece or make a new move.')}return}if(P[q]){pick=q;document.querySelector('#c').textContent='Now choose any square for your piece.'}else document.querySelector('#c').textContent='Pick a piece first, then make up a move.'}}draw()}
function rewindToy(){let H=S.toyHistory||[];if(H.length){S.toy=H.pop();S.toyHistory=H;save()}toy()}

function parent(){set('<section class="p center"><h1>Parent area</h1><p>Hold the button for 2 seconds to enter.</p><button id="hold" class="primary">Hold to enter</button><p id="c" class="coach">Press and hold.</p></section>');let h=document.querySelector('#hold'),t;h.onpointerdown=()=>{document.querySelector('#c').textContent='Keep holding…';t=setTimeout(()=>{t=null;dashboard()},2000)};h.onpointerup=h.onpointercancel=h.onpointerleave=()=>{if(t)clearTimeout(t);let c=document.querySelector('#c');if(c)c.textContent='Hold for 2 seconds to enter.'}}
function dashboard(){set('<section class="p"><span class="tag">Parent Dashboard</span><h1>Shritha’s chess week</h1><section class="grid"><article class="card"><h2>Play together</h2><p>Put one rook on a real board and ask, “Can Rocky reach the star in one straight track?” Let Shritha show you.</p><button onclick="startGame(\'free\')">Play Together</button></article><article class="card"><h2>Chess Powers</h2><p>Board comfort: '+(S.world?'Strong':'Learning')+'<br>Rocky: '+(S.rookDone&&S.checks?.rook?'Strong':'Learning')+'<br>Klip-Klop: '+(S.knightDone&&S.checks?.knight?'Strong':'Learning')+'</p></article><article class="card"><h2>Coach Review</h2><p>'+((S.review||[]).slice(-2).map(x=>typeof x==='string'?x:x.san).join(' · ')||'Play a game to see review notes.')+'</p><button onclick="coachReview()">Open review</button></article></section><button onclick="settings()">Settings & accessibility</button> <button onclick="home()">Back to child home</button></section>')}
function settings(){set('<section class="p"><span class="tag">Parent settings</span><h1>Comfort and accessibility</h1><p>Coach words stay visible. Use 🔊 Repeat on game screens to hear the message again.</p><button onclick="readSettings()">🔊 Try audio</button> <button onclick="dashboard()">Parent dashboard</button></section>')}
function readSettings(){speakWarm('Hi, Shritha! I am Coach Chessy. Take your time. We can figure it out together.')}
function coachReview(){let moments=(S.review||[]).filter(x=>x&&typeof x==='object'&&x.fen&&x.fen.split(' ')[1]==='w').slice(-8);if(!moments.length){set('<section class="p"><h1>Coach Review</h1><p>Play a game first. Chessy will remember a move to revisit together.</p><button onclick="play()">Play</button></section>');return}let m=[...moments].reverse().find(x=>x.captured||x.check||/[x+#]/.test(x.san))||moments.at(-1),g=new Chess(m.fen),selected=null;S.reviewDone=true;save();let positive=m.captured?'You captured a piece with '+m.san+'.':m.check||/[+#]/.test(m.san)?'Your move '+m.san+' gave check.':m.to==='e4'||m.to==='d4'?'Your move '+m.san+' brought a pawn toward the center.':'You chose '+m.san+' in this position.';function draw(msg){set('<section class="p center"><span class="tag">Coach Review · one moment</span><h1>Let’s replay a choice</h1><p>'+positive+'</p>'+bd('reviewBoard',q=>{let p=g.get(q);return p?symbol(p):''})+'<p class="coach" id="c" aria-live="polite">'+(msg||'Try another legal White move. Then notice what changed.')+'</p><div class="toolbar"><button onclick="coachReview()">Again</button><button onclick="document.querySelector(\'#c\').textContent=\'Choose a white piece, then a legal destination. Take your time.\'">Help</button><button onclick="coachReview()">Rewind</button><button onclick="play()">Play again</button><button onclick="home()">Finish for now</button></div></section>');hook('reviewBoard',(q,b)=>{if(selected){let move=g.move({from:selected,to:q,promotion:'q'});selected=null;if(move){let description=move.captured?'It captured a piece.':g.in_check()?'It gave check.':'The board changed, and your opponent would move next.';return draw('You tried '+move.san+'. '+description+' Your earlier move was '+m.san+'. Rewind to compare them.')}document.querySelector('#c').textContent='That move is not legal. Choose a different square.';b.classList.add('bad');return}let p=g.get(q);if(p&&p.color==='w'&&g.turn()==='w'){selected=q;document.querySelector('#c').textContent='Now choose a legal square for this piece.'}else document.querySelector('#c').textContent='Choose a white piece to explore.'})}draw()}

function retention(k){screen='retention_'+k;let rookSkill=k==='rook',from=rookSkill?'c3':'e4',to=rookSkill?'h3':'f6';set('<section class="p center"><span class="tag">A little memory adventure</span><h1>'+(rookSkill?'Rocky’s new road':'Klip-Klop’s new jump')+'</h1><p>It is okay to think again. Move your piece to the star.</p>'+bd('reviewSkillBoard',q=>q===from?(rookSkill?'♜':'♞'):q===to?'★':rookSkill&&q==='c5'?'🪨':'')+'<p id="c" class="coach" aria-live="polite">Try this new position. Help is always welcome.</p><div class="toolbar"><button onclick="document.querySelector(\'#c\').textContent=\''+(rookSkill?'Rocky travels along a row; the rock blocks his column.':'A knight can hop two squares, then one sideways.')+'\'">Help</button><button onclick="retention(\''+k+'\')">Again</button><button onclick="retention(\''+k+'\')">Rewind</button><button onclick="home()">Pause / Save & finish</button></div></section>');hook('reviewSkillBoard',(q,b)=>{if(q!==to){recordLearning('retention_'+k,'mistakes');document.querySelector('#c').textContent='That is not the star yet. Look for '+to+'. Try again together.';b.classList.add('bad');return}S.reviewDue[k]=Date.now()+7*86400000;S.retained=S.retained||{};S.retained[k]=(S.retained[k]||0)+1;recordLearning('retention_'+k,'success');save();celebrate('You remembered!',rookSkill?'Rocky found a straight road in a new place.':'Klip-Klop found an L-shaped jump in a new place.')})}

function quietCheck(skill){let rookSkill=skill==='rook';set('<section class="p hero"><span class="tag">A quiet thought</span><h1>'+ (rookSkill?'Can Rocky travel through a rock?':'Can Klip-Klop jump over a piece?')+'</h1><p>Take your time. You can always ask Chessy for a clue.</p><div class="actions"><button onclick="answerCheck(\''+skill+'\',true)">Yes</button><button onclick="answerCheck(\''+skill+'\',false)">No</button></div><p id="c" class="coach" aria-live="polite">Think back to the tracks and jumps you tried.</p><button onclick="document.querySelector(\'#c\').textContent=\''+(rookSkill?'Rocky stops at a rock.':'Klip-Klop hops in an L.')+'\'">Help</button></section>')}
function answerCheck(skill,yes){let right=skill==='rook'?!yes:yes;if(!right){document.querySelector('#c').textContent='Let’s look back: '+(skill==='rook'?'Rocky stops when a rock blocks the track.':'Klip-Klop can hop over friends and obstacles.')+' Try once more.';return}S.checks=S.checks||{};S.checks[skill]=true;S.reviewDue=S.reviewDue||{};if(!S.reviewDue[skill])S.reviewDue[skill]=Date.now()+86400000;save();celebrate(skill==='rook'?'Rocky did it!':'Klip-Klop is proud!',skill==='rook'?'You used straight tracks and noticed the blocker.':'You found L-shaped jumps and remembered how they hop.')}
function celebrate(a,b){set('<section class="p hero"><div class="big">🎉</div><h1>'+a+'</h1><p>'+b+'</p><div class="actions"><button onclick="home()">Finish for now</button><button class="primary" onclick="next()">One more adventure</button><button onclick="play()">Free playground</button></div></section>')}home();
</script>
</body></html>
